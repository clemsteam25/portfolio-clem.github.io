        <div class="comp-fs-definition">
          <p>La gestion du patrimoine informatique consiste à <strong>recenser, suivre et maintenir</strong> l'ensemble des équipements et logiciels d'une organisation. Cette compétence couvre l'inventaire du parc matériel (postes, serveurs, périphériques), la gestion des licences logicielles, la maintenance préventive et corrective, ainsi que la mise à jour et le renouvellement du parc.</p>
          <p>Elle permet d'assurer la <strong>disponibilité, la traçabilité et la conformité</strong> du système d'information.</p>
        </div>

      <div class="proof-context-block">

        <h3 class="proof-context-title">Stage 1ère année — Semitour / Lascaux IV</h3>
        <div class="proof-context-meta">
          <span><i class="fa-solid fa-calendar"></i> Mai – Juin 2025 &nbsp;·&nbsp; 6 semaines</span>
          <span><i class="fa-solid fa-location-dot"></i> Montignac, Dordogne</span>
          <span><i class="fa-solid fa-building"></i> Service informatique SEMITOUR</span>
        </div>
        <p class="proof-context-text">
          La SEMITOUR Périgord gère une dizaine de sites culturels et touristiques en Dordogne. Son service informatique, basé au siège de Périgueux, supervise l'ensemble de l'infrastructure réseau de ces sites. Durant ce stage, j'ai participé à un projet de <strong>documentation et d'inventorisation du parc réseau</strong> via l'outil <strong>NetBox</strong> (solution IPAM/DCIM open-source). 
        </p>
        <p class="proof-context-text">
          La mission consistait à recenser tous les équipements réseau présents sur le site de Lascaux IV (switchs, patch panels, postes de travail, prises murales), à les créer dans NetBox avec leurs caractéristiques, puis à <strong>documenter les interconnexions physiques</strong> entre chaque équipement.
        </p>

                <span>Microsoft 365</span><span>Phishing</span><span>OAuth 2.0</span><span>MFA bypass</span>
              </div>
              <div class="veille-memo-body">
                <p><strong>Contexte :</strong> Le FBI alerte sur Kali365, un kit de phishing vendu via Telegram, ciblant les comptes Microsoft 365 (Outlook, Teams, OneDrive).</p>
                <p><strong>Comment ça marche :</strong> L'attaque utilise le <em>Device Code Phishing</em>. La victime reçoit un faux mail imitant Microsoft et est invitée à saisir un code sur une vraie page Microsoft. Elle valide en réalité l'accès à son compte — l'attaquant vole le jeton OAuth sans jamais connaître le mot de passe, contournant ainsi le MFA.</p>
                <p><strong>Conséquences :</strong> Vol de données, usurpation d'identité, accès total à la messagerie et aux fichiers de l'entreprise.</p>
                <p><strong>Mesures recommandées :</strong> Désactiver le Device Code Flow, mettre en place des politiques d'accès conditionnel, surveiller les connexions OAuth inhabituelles.</p>
              </div>

    function openPopup(id) {
      document.getElementById('tableau-overlay').classList.add('show');
      document.getElementById('popup-' + id).classList.add('show');
      document.body.style.overflow = 'hidden';
    }
    function closePopup() {
      document.querySelectorAll('.tableau-popup.show').forEach(p => p.classList.remove('show'));
      document.getElementById('tableau-overlay').classList.remove('show');
      document.body.style.overflow = '';
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closePopup(); });
    </script>

  <script>
    const pages = ['accueil','patrimoine','support','presence','projet','services','developpement','competences'];

    function navigate(pageId) {
      if (!pages.includes(pageId)) pageId = 'accueil';
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.page === pageId);
      });
      const tpl = document.getElementById('tpl-' + pageId);
      const app = document.getElementById('app');
      app.innerHTML = '';
      if (tpl) app.appendChild(tpl.content.cloneNode(true));
      history.replaceState(null, '', '#' + pageId);
      window.scrollTo(0, 0);

      // Cartes expandables : clic pour agrandir / réduire
      app.querySelectorAll('.resume-card.expandable').forEach(card => {
        card.addEventListener('click', () => {
          card.classList.toggle('expanded');
        });
      });

      // Lightbox : clic sur image pour agrandir
      app.querySelectorAll('.proof-fig img').forEach(img => {
        img.style.cursor = 'zoom-in';
        img.addEventListener('click', () => {
          const caption = img.closest('figure')?.querySelector('figcaption')?.textContent || '';
          const overlay = document.createElement('div');
          overlay.className = 'lightbox-overlay';
          overlay.innerHTML = `
            <div class="lightbox-inner">
              <img src="${img.src}" alt="${img.alt}" />
              <div class="lightbox-caption">${caption}</div>
              <button class="lightbox-close"><i class="fa-solid fa-xmark"></i></button>
            </div>
          `;
          document.body.appendChild(overlay);
          requestAnimationFrame(() => overlay.classList.add('lightbox-visible'));
          const close = () => {
            overlay.classList.remove('lightbox-visible');
            overlay.addEventListener('transitionend', () => overlay.remove(), { once: true });
          };
          overlay.querySelector('.lightbox-close').addEventListener('click', close);
          overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
          document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); }, { once: true });
        });
      });
    }

    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        e.preventDefault();
        navigate(btn.dataset.page);
      });
    });

    const hash = location.hash.replace('#', '');
    navigate(pages.includes(hash) ? hash : 'accueil');
  </script>
